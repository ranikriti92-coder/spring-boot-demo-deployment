# Service = a stable internal address that always points to the current healthy Pods,
# even as Pods are created/destroyed. Nothing outside the cluster can reach this by itself.
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo-staging
  labels:
    app: demo-app
    env: staging
spec:
  selector:
    app: demo-app
    env: staging
  ports:
    - port: 8080
      targetPort: 8080
