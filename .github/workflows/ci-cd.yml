# EXAMPLE pipeline. If your company's "Lightspeed" tool does this for you automatically
# after a PR merges, you may not need this file at all - ask your platform team.
# This is here so you can see, step by step, what actually happens under the hood
# of any CI/CD tool: build -> test -> build image -> push image -> deploy to OpenShift.

name: CI-CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

  deploy-staging:
    # Only runs after a PR is MERGED into main (a direct push to main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Log in to OpenShift
        run: |
          oc login --token=${{ secrets.OPENSHIFT_STAGING_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }}

      - name: Build and push image
        run: |
          oc project demo-staging
          oc start-build demo-app --from-dir=. --follow
          # (Alternative: docker build + docker push to the registry, then `oc rollout restart`)

      - name: Apply manifests
        run: |
          oc apply -f openshift/staging/

      - name: Wait for rollout
        run: oc rollout status deployment/demo-app -n demo-staging

  deploy-production:
    # Production deploys should be a manual, deliberate action, not automatic.
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production          # GitHub "environments" can require manual approval here
    steps:
      - uses: actions/checkout@v4

      - name: Log in to OpenShift
        run: |
          oc login --token=${{ secrets.OPENSHIFT_PROD_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }}

      - name: Apply manifests
        run: |
          oc apply -f openshift/production/

      - name: Wait for rollout
        run: oc rollout status deployment/demo-app -n demo-production
